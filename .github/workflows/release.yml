name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional until the CurseForge project exists; without it only the GitHub release is created.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check BindPad/

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          # Placeholder: set the CURSEFORGE_PROJECT_ID repository variable once the project is created.
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID || '0' }}
